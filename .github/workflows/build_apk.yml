name: Build Kairo AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build & Sign APK
        run: |
          keytool -genkey -v -keystore kairo.jks -keyalg RSA -keysize 2048 -validity 10000 -alias kairo -storepass kairo123 -keypass kairo123 -dname "CN=KairoAI, OU=Dev, O=Kairo, L=Lahore, S=Punjab, C=PK"
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleDebug
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 app/build/outputs/apk/debug/app-debug.apk app-aligned.apk
          $BUILD_TOOLS/apksigner sign --ks kairo.jks --ks-pass pass:kairo123 --key-pass pass:kairo123 --out Kairo-AI-Signed.apk app-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairo-AI-Signed-APK
          path: Kairo-AI-Signed.apk
