name: Build Kairo AI Agent APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Keystore & Build Signed APK
        run: |
          keytool -genkey -v -keystore kairo.jks -keyalg RSA -keysize 2048 -validity 10000 -alias kairo -storepass kairo123 -keypass kairo123 -dname "CN=KairoAI, OU=Dev, O=Kairo, L=Lahore, S=Punjab, C=PK"
          chmod +x gradlew || gradle wrapper
          ./gradlew assembleRelease
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app/build/outputs/apk/release/app-release-unsigned.apk app-aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks kairo.jks --ks-pass pass:kairo123 --key-pass pass:kairo123 --out Kairo-AI-Signed.apk app-aligned.apk

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: Kairo-AI-Signed-APK
          path: Kairo-AI-Signed.apk
